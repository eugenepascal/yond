<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yond — Tableau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#FAFBFC; --surface-hover:#F4F5F7;
  --text:#172B4D; --text-2:#42526E; --text-3:#6B778C; --text-faint:#97A0AF;
  --border:#DFE1E6; --border-strong:#C1C7D0;
  --blue:#0052CC; --blue-h:#0065FF; --blue-bg:#DEEBFF; --blue-dot:#2684FF;
  --green:#006644; --green-bg:#E3FCEF; --green-dot:#36B37E;
  --amber:#974F0C; --amber-bg:#FFF0B3; --amber-dot:#FFAB00;
  --red:#BF2600; --red-bg:#FFEBE6; --red-dot:#FF5630;
  --purple:#5243AA; --purple-bg:#EAE6FF;
  --gray:#42526E; --gray-bg:#DFE1E6; --gray-dot:#8993A4;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --r-xs:3px; --r-sm:4px; --r-md:6px; --r-lg:10px;
  --shadow-1:0 1px 2px rgba(9,30,66,.13), 0 0px 1px rgba(9,30,66,.16);
  --shadow-2:0 4px 8px -2px rgba(9,30,66,.16), 0 0 1px rgba(9,30,66,.24);
  --shadow-3:0 12px 32px -4px rgba(9,30,66,.24), 0 0 1px rgba(9,30,66,.24);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;}
::placeholder{color:var(--text-faint);}
::selection{ background:var(--blue-bg); color:var(--blue); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
button{ font-family:var(--sans); }
a{ color:var(--blue); }

/* ================= layout shell ================= */
#app-shell{ display:flex; flex-direction:column; height:100vh; }

/* ---- top bar ---- */
#topbar{ height:56px; min-height:56px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:18px; padding:0 18px; box-shadow:var(--shadow-1); position:relative; z-index:70; }
.logo{ display:flex; align-items:center; gap:9px; flex:none; background:transparent; border:none; cursor:pointer; padding:4px 6px; border-radius:var(--r-sm); transition:background .12s ease; }
.logo:hover{ background:var(--surface-2); }
.logo .mark{ width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,#0B3D5C,#2D9CDB 55%,#FFB86B); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:var(--shadow-1); }
.logo .word{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; color:var(--text); }
.logo .word b{ color:var(--blue); }
#topbar-search{ flex:1; max-width:420px; position:relative; }
#topbar-search svg{ position:absolute; left:11px; top:9px; color:var(--text-faint); pointer-events:none; }
#topbar-search input{ width:100%; height:34px; border-radius:var(--r-md); border:1px solid transparent; background:var(--bg); padding:0 12px 0 34px; font-size:13.5px; color:var(--text); transition:all .12s ease; }
#topbar-search input:focus{ outline:none; background:var(--surface); border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg); }
.topbar-spacer{ flex:1; }
.topbar-right{ display:flex; align-items:center; gap:10px; flex:none; }
.lang-switch{ display:flex; background:var(--bg); border-radius:var(--r-md); padding:2px; gap:1px; }
.lang-switch button{ font-family:var(--mono); font-size:10.5px; font-weight:700; padding:5px 8px; border:none; background:transparent; color:var(--text-3); border-radius:var(--r-sm); cursor:pointer; transition:all .12s ease; }
.lang-switch button.active{ background:var(--surface); color:var(--blue); box-shadow:var(--shadow-1); }
.icon-btn.active-icon{ background:var(--blue-bg); color:var(--blue); }
.avatar{ border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; color:#fff; flex:none; font-size:12px; }
#user-avatar{ width:32px; height:32px; background:linear-gradient(135deg,#5243AA,#8777D9); font-size:13px; box-shadow:var(--shadow-1); }

/* ---- subbar ---- */
#subbar{ height:52px; min-height:52px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; padding:0 18px; }
.view-toggle{ display:flex; background:var(--bg); border-radius:var(--r-md); padding:3px; gap:2px; }
.view-toggle button{ display:flex; align-items:center; gap:6px; padding:6px 12px; border:none; background:transparent; border-radius:var(--r-sm); cursor:pointer; font-size:12.5px; font-weight:500; color:var(--text-3); transition:all .12s ease; }
.view-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow-1); }
.view-toggle button:hover:not(.active){ color:var(--text); }
.subbar-sep{ width:1px; height:24px; background:var(--border); margin:0 4px; }
.prio-filter{ display:flex; gap:5px; }
.pf-chip{ display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:16px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:500; color:var(--text-3); cursor:pointer; transition:all .12s ease; }
.pf-chip:hover{ border-color:var(--border-strong); color:var(--text); }
.pf-chip.active{ background:var(--blue-bg); border-color:var(--blue-h); color:var(--blue); }
.subbar-count{ margin-left:auto; font-size:12.5px; color:var(--text-3); font-weight:500; }
.label-chip{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:14px; font-size:11.5px; font-weight:600; border:1.5px solid transparent; cursor:pointer; transition:all .12s ease; }
.label-chip.off{ opacity:.45; }
.label-chip .dot{ width:7px; height:7px; border-radius:50%; }
.archive-banner{ display:flex; align-items:center; gap:8px; background:var(--amber-bg); color:var(--amber); border:1px solid #FFE1A6; border-radius:var(--r-md); padding:10px 14px; margin-bottom:16px; font-size:12.5px; font-weight:600; }
.btn-create{ display:flex; align-items:center; gap:6px; background:var(--blue); color:#fff; border:none; border-radius:var(--r-md); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:var(--shadow-1); transition:all .12s ease; }
.btn-create:hover{ background:var(--blue-h); box-shadow:var(--shadow-2); transform:translateY(-1px); }
.btn-create:active{ transform:translateY(0); }

/* ---- main scroll area ---- */
#main-area{ flex:1; overflow:auto; padding:20px; }

/* ================= dark "boards home" landing ================= */
.th-shell{ display:flex; margin:-20px; min-height:calc(100vh - 108px); background:#1D2125; }
.th-sidebar{ width:272px; min-width:272px; background:#1D2125; padding:22px 14px; border-right:1px solid #2C333A; }
.th-nav-item{ display:flex; align-items:center; gap:12px; width:100%; padding:9px 12px; border-radius:6px; border:none; background:transparent; color:#B6C2CF; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:2px; transition:background .12s ease; text-align:left; }
.th-nav-item:hover{ background:#2C333A; }
.th-nav-item.active{ background:#25406B; color:#579DFF; }
.th-nav-sep{ height:1px; background:#2C333A; margin:16px 4px; }
.th-ws-label{ font-size:11.5px; font-weight:700; color:#9FADBC; text-transform:uppercase; letter-spacing:.04em; padding:0 12px; margin-bottom:8px; }
.th-ws-pill{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 12px; border-radius:6px; border:none; background:transparent; color:#B6C2CF; font-size:14px; font-weight:600; cursor:pointer; }
.th-ws-pill:hover{ background:#2C333A; }
.th-ws-icon{ width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:12px; flex:none; }
.th-content{ flex:1; padding:30px 34px 50px; min-width:0; position:relative; background:radial-gradient(1100px 420px at 15% -8%, rgba(87,157,255,.08), transparent 60%); overflow:hidden; }
.th-blob{ position:absolute; border-radius:50%; filter:blur(6px); pointer-events:none; z-index:0; animation:emptyFloat 8s ease-in-out infinite; }
.th-content > *{ position:relative; z-index:1; }
@keyframes staggerIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.stagger-in{ animation:staggerIn .4s cubic-bezier(.2,.8,.3,1) both; }
.home-stat-strip{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
.home-stat-chip{ display:flex; align-items:center; gap:9px; background:#22272B; border:1px solid #2C333A; border-radius:10px; padding:10px 15px; }
.home-stat-chip .ic{ font-size:16px; }
.home-stat-chip .v{ font-family:var(--mono); font-size:17px; font-weight:700; color:#E8EBED; }
.home-stat-chip .l{ font-size:10.5px; color:#9FADBC; }
.th-sec-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.th-sec-title{ display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700; color:#E8EBED; margin:0; }
.th-close{ width:30px; height:30px; border-radius:6px; border:none; background:transparent; color:#9FADBC; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.th-close:hover{ background:#2C333A; color:#E8EBED; }
.th-sub{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; color:#9FADBC; font-size:13.5px; margin:6px 0 18px; }
.th-select{ background:#22272B; border:1px solid #3C4450; color:#B6C2CF; border-radius:6px; padding:8px 12px; font-size:13px; }
.th-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:12px; }
.th-tpl-card{ border-radius:10px; overflow:hidden; background:#22272B; border:1px solid #2C333A; cursor:pointer; transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease, border-color .16s ease; text-align:left; }
.th-tpl-card:hover{ transform:translateY(-4px) scale(1.02) rotate(-.4deg); box-shadow:0 16px 30px rgba(0,0,0,.45); border-color:#3C4450; }
.th-tpl-thumb{ height:108px; position:relative; display:flex; align-items:flex-end; justify-content:flex-end; padding:10px; overflow:hidden; }
.th-tpl-thumb::after{ content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 32%, rgba(0,0,0,.12) 100%); pointer-events:none; }
.th-tpl-badge{ background:rgba(255,255,255,.92); color:#22272B; font-size:10px; font-weight:800; letter-spacing:.04em; padding:3px 8px; border-radius:4px; }
.th-tpl-emoji{ position:absolute; top:12px; left:14px; font-size:26px; }
.th-tpl-title{ padding:12px 14px 14px; font-size:14px; font-weight:700; color:#E8EBED; }
.th-link{ color:#579DFF; font-size:13.5px; text-decoration:none; }
.th-link:hover{ text-decoration:underline; }
.th-promo{ margin-top:44px; }
.th-promo-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.th-promo-mark{ width:30px; height:30px; border-radius:7px; background:linear-gradient(135deg,#579DFF,#8E2DE2); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 4px 12px rgba(87,157,255,.35); }
.th-promo-name{ font-size:19px; font-weight:800; color:#E8EBED; }
.th-promo-desc{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; color:#9FADBC; font-size:13.5px; margin-bottom:18px; }
.th-btn-outline{ background:transparent; border:1.5px solid #579DFF; color:#579DFF; border-radius:6px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
.th-btn-outline:hover{ background:rgba(87,157,255,.1); }
.th-feat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
.th-feat-card{ background:linear-gradient(160deg,#0052CC,#2684FF); border-radius:10px; padding:16px 18px; height:150px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; border:none; text-align:left; transition:transform .13s ease; }
.th-feat-card:hover{ transform:translateY(-2px); }
.th-feat-card b{ color:#fff; font-size:15px; font-weight:800; line-height:1.3; }
.th-feat-card span{ color:rgba(255,255,255,.75); font-size:11.5px; line-height:1.4; }
.th-feat-arrow{ align-self:flex-end; color:#fff; }

/* ---- Jira-style promo (board mockups) ---- */
.jira-card{ position:relative; border-radius:12px; overflow:hidden; border:none; cursor:pointer; text-align:left; padding:0; height:172px; display:flex; flex-direction:column; box-shadow:0 6px 16px rgba(0,0,0,.35); transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease; }
.jira-card:hover{ transform:translateY(-5px) scale(1.015); box-shadow:0 20px 36px rgba(0,0,0,.5); }
.jira-card-head{ padding:12px 14px 8px; }
.jira-card-head b{ color:#fff; font-size:14.5px; font-weight:800; line-height:1.25; display:block; }
.jira-card-mockup{ flex:1; margin:0 10px 10px; background:#F4F5F7; border-radius:8px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.jira-card-arrow{ position:absolute; bottom:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.92); color:#0052CC; display:flex; align-items:center; justify-content:center; }
.th-recent{ margin-top:44px; }
.th-recent-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
.th-recent-card{ background:#22272B; border:1px solid #2C333A; border-radius:10px; overflow:hidden; cursor:pointer; text-align:left; transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease, border-color .16s ease; }
.th-recent-card:hover{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(0,0,0,.4); border-color:#3C4450; }
.th-recent-thumb{ height:96px; display:flex; align-items:center; justify-content:center; font-size:30px; position:relative; }
.th-recent-thumb img{ width:100%; height:100%; object-fit:cover; }
.th-recent-title{ padding:10px 12px 12px; font-size:13px; font-weight:700; color:#E8EBED; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.th-recent-meta{ padding:0 12px 12px; font-size:11px; color:#9FADBC; }
@media (max-width: 860px){
  .th-shell{ flex-direction:column; }
  .th-sidebar{ width:100%; border-right:none; border-bottom:1px solid #2C333A; padding:14px; }
}
.idea-sugg-bar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.idea-sugg-input{ flex:1; min-width:220px; max-width:360px; background:#22272B; border:1px solid #3C4450; color:#E8EBED; border-radius:6px; padding:9px 12px; font-size:13px; }
.idea-sugg-input::placeholder{ color:#7A869A; }
.idea-sugg-input:focus{ outline:none; border-color:#579DFF; box-shadow:0 0 0 3px rgba(87,157,255,.25); }
.idea-sugg-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
.idea-sugg-card{ background:#22272B; border:1px solid #2C333A; border-radius:12px; padding:0; overflow:hidden; transition:transform .15s cubic-bezier(.2,.8,.3,1), box-shadow .15s ease, border-color .15s ease; }
.idea-sugg-card:hover{ transform:translateY(-3px); box-shadow:0 14px 26px rgba(0,0,0,.4); border-color:#3C4450; }
.idea-sugg-head{ padding:14px 16px 10px; }
.idea-sugg-head .dom{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; opacity:.85; }
.idea-sugg-title{ font-size:14.5px; font-weight:700; color:#E8EBED; margin:4px 0 0; line-height:1.3; }
.idea-sugg-body{ padding:4px 16px 16px; }
.idea-sugg-desc{ font-size:12.5px; color:#B6C2CF; line-height:1.5; margin:0 0 8px; }
.idea-sugg-raison{ font-size:11.5px; color:#9FADBC; font-style:italic; line-height:1.4; margin:0 0 12px; border-left:2px solid #3C4450; padding-left:8px; }
.verdict-badge{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:14px; font-size:11px; font-weight:800; letter-spacing:.02em; }
.myidea-list-title{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#7A869A; margin:10px 0 4px; }
.myidea-mini-list{ margin:0 0 8px; padding-left:16px; font-size:11.5px; color:#B6C2CF; line-height:1.55; }
.hl{ display:inline-block; padding:2px 8px; border-radius:5px; font-weight:700; }
.hl-red{ background:var(--red-bg); color:var(--red); }
.hl-green{ background:var(--green-bg); color:var(--green); }
.hl-amber{ background:var(--amber-bg); color:var(--amber); }

/* ================= login screen ================= */
#login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#0B3D5C,#1D2125 55%,#132B1F); padding:24px; position:relative; overflow:hidden; }
.lang-switch-login{ position:absolute; top:20px; right:20px; z-index:5; background:rgba(255,255,255,.12); border-radius:8px; padding:3px; display:flex; gap:1px; }
.lang-switch-login button{ font-family:var(--mono); font-size:11px; font-weight:700; padding:6px 11px; border:none; background:transparent; color:rgba(255,255,255,.75); border-radius:6px; cursor:pointer; transition:all .12s ease; }
.lang-switch-login button.active{ background:rgba(255,255,255,.92); color:#0B3D5C; }
#login-shell .bg-shape{ position:absolute; border-radius:50%; filter:blur(2px); opacity:.5; animation:emptyFloat 7s ease-in-out infinite; }
.login-wrap{ position:relative; z-index:1; width:100%; max-width:860px; background:var(--surface); border-radius:20px; box-shadow:0 30px 70px rgba(0,0,0,.45); overflow:hidden; display:flex; min-height:520px; }
.login-side{ flex:1 1 44%; background:linear-gradient(160deg,#0B3D5C,#12314A 45%,#1B2D1F 100%); padding:40px 36px; color:#fff; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.login-side::before{ content:""; position:absolute; inset:0; background:radial-gradient(420px 260px at 90% 100%, rgba(255,184,107,.18), transparent 60%), radial-gradient(360px 220px at 0% 0%, rgba(45,156,219,.22), transparent 60%); }
.login-side-shape{ position:absolute; border-radius:50%; opacity:.5; animation:emptyFloat 6s ease-in-out infinite; }
.login-side-content{ position:relative; z-index:1; }
.login-side .brand{ display:flex; align-items:center; gap:11px; margin-bottom:34px; }
.login-side .brand .mark{ width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; }
.login-side .brand .name{ font-size:19px; font-weight:800; }
.login-side h2{ font-size:23px; font-weight:800; line-height:1.3; margin:0 0 10px; }
.login-side p.sub{ font-size:13px; color:#CFE8DE; line-height:1.6; margin:0 0 28px; max-width:320px; }
.login-feature-list{ display:flex; flex-direction:column; gap:14px; margin-top:auto; }
.login-feature-list .lf{ display:flex; align-items:center; gap:11px; font-size:13px; color:#EAF4EF; }
.login-feature-list .lf .em{ width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; }
.login-form-side{ flex:1 1 56%; padding:42px 44px; display:flex; flex-direction:column; justify-content:center; }
.login-form-head{ margin-bottom:22px; }
.login-form-head h1{ font-size:21px; font-weight:800; margin:0 0 5px; letter-spacing:-.01em; }
.login-form-head p{ font-size:12.5px; color:var(--text-3); margin:0; }
.login-google{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px; border-radius:8px; border:1.5px solid var(--border); background:#fff; color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s cubic-bezier(.2,.8,.3,1); }
.login-google:hover{ background:var(--surface-2); border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow-1); }
.login-sep{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--text-faint); font-size:11.5px; }
.login-sep::before, .login-sep::after{ content:""; flex:1; height:1px; background:var(--border); }
.login-field{ margin-bottom:12px; }
.login-field label{ display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; }
.login-error{ display:flex; align-items:center; gap:8px; background:var(--red-bg); color:var(--red); font-size:12px; font-weight:600; padding:10px 13px; border-radius:8px; margin-bottom:14px; }
.login-switch{ text-align:center; font-size:12.5px; color:var(--text-3); margin-top:18px; }
.login-switch button{ background:none; border:none; color:var(--blue); font-weight:700; cursor:pointer; padding:0; }
.login-forgot{ display:block; text-align:right; font-size:11.5px; color:var(--text-3); background:none; border:none; cursor:pointer; margin:-4px 0 14px; padding:0; }
.login-forgot:hover{ color:var(--blue); }
.login-remember{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-3); margin:2px 0 14px; cursor:pointer; }

/* ================= list view ================= */

    diagram:{blocks:[], edges:[]}, diagramAutoSync:true,

    aiSuggestions:null, aiQA:[], lastReport:null,
    notes:"", createdAt: new Date().toISOString(),
  };

function normalizeProject(p){
  ["financements","acteurs","etapes","realisations","diagramNodes","comments","labels","aiQA"].forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; });
  if(typeof p.diagramNotes!=="string") p.diagramNotes="";
  if(typeof p.notes!=="string") p.notes="";
  if(p.notes && !/<[a-z][\s\S]*>/i.test(p.notes)){ p.notes = "<p>"+escapeHtml(p.notes).replace(/\n/g,"<br>")+"</p>"; }
  if(!p.diagramMode) p.diagramMode="auto";
  if(typeof p.favori!=="boolean") p.favori=false;
  if(typeof p.archived!=="boolean") p.archived=false;
  if(p.coverImageId===undefined) p.coverImageId=null;
  if(typeof p.diagramAutoSync!=="boolean") p.diagramAutoSync=true;
  if(p.aiSuggestions===undefined) p.aiSuggestions=null;
  if(p.lastReport===undefined) p.lastReport=null;
  if(!p.diagram || !Array.isArray(p.diagram.blocks)){
    // migrate legacy tree-notes diagram into the new block/edge canvas model
    let nodes = [];
    if(p.diagramMode==="manuel" && p.diagramNodes.length>0) nodes = p.diagramNodes;
    else if(p.diagramNotes) nodes = parseNotesToNodes(p.diagramNotes);
    if(nodes.length>0){
      const {positions} = layoutTree(nodes);
      const blocks = nodes.map(n=>({id:n.id, type:"note", title:n.text||"", subtitle:"", x:(positions[n.id]||{x:20}).x, y:(positions[n.id]||{y:20}).y, imageId:null}));
      const edges = nodes.filter(n=>n.parentId).map(n=>({id:uid(), from:n.parentId, to:n.id}));
      p.diagram = {blocks, edges};
    } else {
      p.diagram = {blocks:[], edges:[]};
    }
  }
  return p;
}

async function loadProjects(){
  resetLocalState();
  try{
    const res = await window.storage.get("projects", false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(Array.isArray(parsed)){
        state.projects = parsed;
        state.projects.forEach((p,i)=>{ if(!p.code) p.code = "PRJ-"+(i+1); });
        state.counter = parsed.length;
      } else if(parsed && Array.isArray(parsed.items)){
        state.projects = parsed.items;
        state.counter = parsed.counter || parsed.items.length;
      }
      state.projects.forEach(normalizeProject);
    }
  }catch(e){ /* rien à charger */ }
  state.loaded = true;
  render();

/* ======================================================================
   Diagram engine (unchanged core)
   ====================================================================== */
function parseNotesToNodes(text){
  const lines = (text||"").split("\n").filter(l=>l.trim()!=="");
  const stack = []; const nodes = [];
  for(const raw of lines){
    const leading = raw.match(/^[\t ]*/)[0];
    const level = leading.split("").reduce((acc,ch)=> acc + (ch==="\t"?1:0), 0) + Math.floor(leading.replace(/\t/g,"").length/2);
    const content = raw.trim().replace(/^[-*•]\s*/, "");
    if(!content) continue;
    const node = {id: uid(), text: content, parentId: null};
    while(stack.length && stack[stack.length-1].level >= level) stack.pop();
    if(stack.length) node.parentId = stack[stack.length-1].id;
    stack.push({level, id: node.id});
    nodes.push(node);
  }
  return nodes;
}
function layoutTree(nodes){
  const byParent = {};
  nodes.forEach(n=>{ const key = n.parentId || "__root__"; (byParent[key]=byParent[key]||[]).push(n); });
  const roots = byParent["__root__"] || [];
  const positions = {}; const ROW=62, COL=210, PAD=30;
  let yCounter=0, maxDepth=0;
  function place(node, depth){
    maxDepth = Math.max(maxDepth, depth);
    const kids = byParent[node.id] || [];
    if(kids.length===0){ positions[node.id]={x:PAD+depth*COL,y:PAD+yCounter*ROW}; yCounter++; }
    else{ const startY=yCounter; kids.forEach(k=>place(k,depth+1)); const endY=yCounter-1; positions[node.id]={x:PAD+depth*COL,y:PAD+((startY+endY)/2)*ROW}; }
  }
  roots.forEach(r=>place(r,0));
  const width = PAD*2+(maxDepth+1)*COL-(COL-170);
  const height = PAD*2+Math.max(yCounter,1)*ROW-(ROW-44);
  return {positions, width:Math.max(width,300), height:Math.max(height,120)};
}
function wrapLines(text, maxChars){
  const words=text.split(" "); const lines=[]; let cur="";
  for(const w of words){ if((cur+" "+w).trim().length>maxChars){ if(cur) lines.push(cur.trim()); cur=w; } else { cur=(cur+" "+w).trim(); } if(lines.length===2) break; }
  if(cur && lines.length<2) lines.push(cur.trim());
  if(lines.length===2 && words.join(" ").length > lines.join(" ").length){ lines[1]=lines[1].slice(0,17)+(lines[1].length>17?"…":""); }
  return lines;
}
function renderDiagramSVG(nodes){
  if(!nodes || nodes.length===0) return '<p class="hint">Rien à représenter. Ajoutez des notes ou des blocs pour générer le schéma.</p>';
  const {positions,width,height} = layoutTree(nodes);
  const NW=170, NH=44; let edges="";
  nodes.forEach(n=>{ if(n.parentId && positions[n.parentId]){ const p1=positions[n.parentId],p2=positions[n.id]; const x1=p1.x+NW,y1=p1.y+NH/2,x2=p2.x,y2=p2.y+NH/2,mx=(x1+x2)/2;
    edges += `<path d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="#C1C7D0" stroke-width="1.5"/>`; }});
  let boxes="";
  nodes.forEach(n=>{ const pos=positions[n.id]; if(!pos) return; const isRoot=!n.parentId;
    const stroke = isRoot? "#0052CC":"#DFE1E6"; const fill = isRoot? "#DEEBFF":"#FFFFFF";
    const lines = wrapLines(n.text||"Sans titre",20); const textY = lines.length===1? pos.y+NH/2+4 : pos.y+NH/2-2;
    const textEls = lines.map((ln,i)=>`<text x="${pos.x+NW/2}" y="${textY+i*14}" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#172B4D">${escapeHtml(ln)}</text>`).join("");
    boxes += `<g><title>${escapeHtml(n.text||"")}</title><rect x="${pos.x}" y="${pos.y}" width="${NW}" height="${NH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.4"/>${textEls}</g>`; });
  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">${edges}${boxes}</svg>`;
}

/* ---- structural canvas (contexte / déroulement / acteurs / financement / réalisations / images / notes) ---- */
function blockCenter(b){ return {cx:(b.x||0)+BLOCK_W/2, cy:(b.y||0)+BLOCK_H_EST/2}; }
function nextBlockPos(diagram){
  const n = diagram.blocks.length;
  const col = n % 4, row = Math.floor(n/4);
  return {x: 24 + col*(BLOCK_W+26), y: 24 + row*(BLOCK_H_EST+40)};
}
function generateProjectDiagram(p){
  const blocks = [], edges = [];
  let y = 24;
  const rowGap = BLOCK_H_EST + 46;
  let ctxId = null;
  if((p.description||"").trim()){
    ctxId = uid();
    blocks.push({id:ctxId, type:"contexte", title:"Contexte", subtitle:(p.description||"").slice(0,90), x: 24, y, imageId:null});
    y += rowGap;
  }
  const etapeIds = [];
  (p.etapes||[]).forEach((e,i)=>{
    const id = uid(); etapeIds.push(id);
    blocks.push({id, type:"etape", title:e.titre||"Étape", subtitle:e.statut||"", x: 24+i*(BLOCK_W+26), y, imageId:null});
  });
  if(etapeIds.length){
    if(ctxId) edges.push({id:uid(), from:ctxId, to:etapeIds[0]});
    for(let i=0;i<etapeIds.length-1;i++) edges.push({id:uid(), from:etapeIds[i], to:etapeIds[i+1]});
    y += rowGap;
  }
  const acteurIds = [];
  (p.acteurs||[]).filter(a=>a.nom).forEach((a,i)=>{
    const id = uid(); acteurIds.push(id);
    blocks.push({id, type:"acteur", title:a.nom, subtitle:a.role||"", x: 24+i*(BLOCK_W+26), y, imageId:null});
    if(ctxId) edges.push({id:uid(), from:ctxId, to:id});
  });
  if(acteurIds.length) y += rowGap;
  const finIds = [];
  (p.financements||[]).forEach((f,i)=>{
    const id = uid(); finIds.push(id);
    blocks.push({id, type:"financement", title:f.source||"Financement", subtitle:f.montant?fmtMontant(f.montant):"", x: 24+i*(BLOCK_W+26), y, imageId:null});
    if(ctxId) edges.push({id:uid(), from:ctxId, to:id});
  });
  if(finIds.length) y += rowGap;
  const lastEtape = etapeIds.length ? etapeIds[etapeIds.length-1] : ctxId;
  (p.realisations||[]).forEach((r,i)=>{
    const id = uid();
    blocks.push({id, type:"realisation", title:r.titre||"Réalisation", subtitle:r.date?fmtDateShort(r.date):"", x: 24+i*(BLOCK_W+26), y, imageId:null});
    if(lastEtape) edges.push({id:uid(), from:lastEtape, to:id});
  });
  return {blocks, edges};
}
function syncDiagramWithProject(p){
  if(!p.diagram || !Array.isArray(p.diagram.blocks)) p.diagram = {blocks:[], edges:[]};
  const blocks = p.diagram.blocks;
  const bySource = {};
  blocks.forEach(b=>{ if(b.sourceId) bySource[b.sourceId]=b; });
  const seen = new Set();
  let changed = false;

  function upsert(sourceId, type, title, subtitle){
    seen.add(sourceId);
    let b = bySource[sourceId];
    if(b){
      if(b.title!==title || b.subtitle!==subtitle){ b.title=title; b.subtitle=subtitle; changed=true; }
    } else {
      const pos = nextBlockPos(p.diagram);
      b = {id:uid(), type, title, subtitle, x:pos.x, y:pos.y, imageId:null, sourceId};
      blocks.push(b);
      bySource[sourceId] = b;
      changed = true;
    }
  }

  if((p.description||"").trim()) upsert("context", "contexte", "Contexte", (p.description||"").slice(0,90));
  (p.etapes||[]).forEach(e=>upsert("etape:"+e.id, "etape", e.titre||"Étape", e.statut||""));
  (p.acteurs||[]).filter(a=>a.nom).forEach(a=>upsert("acteur:"+a.id, "acteur", a.nom, a.role||""));
  (p.financements||[]).forEach(f=>upsert("fin:"+f.id, "financement", f.source||"Financement", f.montant?fmtMontant(f.montant):""));
  (p.realisations||[]).forEach(r=>upsert("real:"+r.id, "realisation", r.titre||"Réalisation", r.date?fmtDateShort(r.date):""));

  const before = blocks.length;
  p.diagram.blocks = blocks.filter(b=> !b.sourceId || seen.has(b.sourceId));
  if(p.diagram.blocks.length!==before) changed = true;
  const ids = new Set(p.diagram.blocks.map(b=>b.id));
  const edgesBefore = p.diagram.edges.length;
  p.diagram.edges = p.diagram.edges.filter(e=>ids.has(e.from) && ids.has(e.to));
  if(p.diagram.edges.length!==edgesBefore) changed = true;
  return changed;
}
function renderSchemaEdgesSVG(p, w, h){
  const {blocks, edges} = p.diagram;
  const byId = {}; blocks.forEach(b=>byId[b.id]=b);
  let lines = "";
  edges.forEach(e=>{
    const a = byId[e.from], b = byId[e.to];
    if(!a || !b) return;
    const c1 = blockCenter(a), c2 = blockCenter(b);
    lines += `<line data-edge-id="${e.id}" data-from="${e.from}" data-to="${e.to}" x1="${c1.cx}" y1="${c1.cy}" x2="${c2.cx}" y2="${c2.cy}" stroke="#8993A4" stroke-width="1.8" marker-end="url(#arrowh)"/>`;
  });
  return `<svg id="schema-svg" width="${w}" height="${h}" style="position:absolute;top:0;left:0;pointer-events:none;">
    <defs><marker id="arrowh" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8993A4"/></marker></defs>
    ${lines}</svg>`;
}
function exportSchemaSVG(p){
  const {blocks, edges} = p.diagram;
  if(blocks.length===0) return `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80"><text x="10" y="40" font-family="Inter" font-size="13" fill="#6B778C">Schéma vide</text></svg>`;
  const maxX = Math.max(...blocks.map(b=>(b.x||0)+BLOCK_W)) + 30;
  const maxY = Math.max(...blocks.map(b=>(b.y||0)+BLOCK_H_EST)) + 30;
  const byId = {}; blocks.forEach(b=>byId[b.id]=b);
  let lines = "";
  edges.forEach(e=>{
    const a=byId[e.from], b=byId[e.to]; if(!a||!b) return;
    const c1=blockCenter(a), c2=blockCenter(b);
    lines += `<line x1="${c1.cx}" y1="${c1.cy}" x2="${c2.cx}" y2="${c2.cy}" stroke="#8993A4" stroke-width="1.8" marker-end="url(#arrowh)"/>`;
  });
  let boxes = "";
  blocks.forEach(b=>{
    const meta = BLOCK_TYPES[b.type]||BLOCK_TYPES.note;
    const lines2 = wrapLines(b.title||meta.label, 20);
    const textY = b.y+30;
    const textEls = lines2.map((ln,i)=>`<text x="${b.x+14}" y="${textY+i*15}" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#172B4D">${escapeHtml(ln)}</text>`).join("");
    const subEl = b.subtitle ? `<text x="${b.x+14}" y="${b.y+BLOCK_H_EST-14}" font-family="Inter, sans-serif" font-size="10.5" fill="#6B778C">${escapeHtml(b.subtitle.slice(0,26))}</text>` : "";
    const imgEl = b.imageId ? imgTagFor(p, b.imageId, b.x+BLOCK_W-40, b.y+10, 30, 30) : "";
    boxes += `<g><rect x="${b.x}" y="${b.y}" width="${BLOCK_W}" height="${BLOCK_H_EST}" rx="8" fill="${meta.bg}" stroke="${meta.color}" stroke-width="1.4"/>
      <text x="${b.x+14}" y="${b.y+16}" font-family="IBM Plex Mono, monospace" font-size="9.5" letter-spacing="1" fill="${meta.color}">${escapeHtml(meta.label.toUpperCase())}</text>
      ${textEls}${subEl}${imgEl}</g>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${maxX} ${maxY}" width="${maxX}" height="${maxY}">
    <defs><marker id="arrowh" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8993A4"/></marker></defs>
    <rect x="0" y="0" width="${maxX}" height="${maxY}" fill="#FAFBFC"/>
    ${lines}${boxes}</svg>`;
}
function imgTagFor(p, imageId, x, y, w, h){
  const imgs = state.imagesByProject[p.id];
  if(!Array.isArray(imgs)) return "";
  const im = imgs.find(i=>i.id===imageId);
  if(!im) return "";
  return `<image href="${im.dataUrl}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="inset(0% round 4px)"/>`;
}

function resizeImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const maxW=1000; const scale=Math.min(1,maxW/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",0.75));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleFilesAdded(projectId, fileList){
  const files = Array.from(fileList).filter(f=>f.type.startsWith("image/"));
  if(files.length===0) return;
  if(state.imagesByProject[projectId]==="loading" || state.imagesByProject[projectId]===undefined) await ensureImagesLoaded(projectId);
  for(const file of files){
    try{ const dataUrl = await resizeImageFile(file); state.imagesByProject[projectId].push({id:uid(), name:file.name, caption:"", dataUrl, addedAt:new Date().toISOString()}); }
    catch(e){}
  }
  scheduleSaveImages(projectId); render();
}

function updateTabHighlight(){
  const pills = document.getElementById("tab-pills");
  const hl = document.getElementById("tab-highlight");
  if(!pills || !hl) return;
  const active = pills.querySelector(".tab-pill.active");
  if(!active){ hl.style.opacity="0"; return; }
  hl.style.width = active.offsetWidth+"px";
  hl.style.transform = "translateX("+active.offsetLeft+"px)";
  hl.style.opacity = "1";
}
function animateProgressRings(){
  document.querySelectorAll("circle[data-target-offset]").forEach(c=>{
    const target = c.getAttribute("data-target-offset");
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ c.style.strokeDashoffset = target; }); });
  });
}
function animateCountUps(){
  document.querySelectorAll("[data-countup]").forEach(el=>{
    const target = parseInt(el.getAttribute("data-countup"), 10) || 0;
    const duration = 650;
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(eased*target);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function progressRingSVG(pct, size, stroke, color){
  size = size||64; stroke = stroke||6; color = color||"var(--pine, #2D6A4F)";
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const offset = c - (Math.max(0,Math.min(100,pct))/100)*c;
  return `<span class="progress-ring-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--border)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}" data-target-offset="${offset.toFixed(2)}" style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1);"/>
  </svg><span class="progress-ring-pct">${Math.round(pct)}%</span></span>`;
}
function showToast(text, type){
  const stack = document.getElementById("toast-stack");
  if(!stack) return;
  const el = document.createElement("div");
  el.className = "toast" + (type?" "+type:"");
  el.textContent = text;
  stack.appendChild(el);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.classList.add("show"); }); });
  setTimeout(()=>{
    el.classList.remove("show");
    setTimeout(()=>el.remove(), 300);
  }, 3000);
}
function confettiBurst(){
  const colors = ["#FF5630","#36B37E","#0052CC","#FFAB00","#5243AA","#00C7E6"];
  for(let i=0;i<30;i++){
    const el = document.createElement("div");
    const left = Math.random()*100;
    const size = 6+Math.random()*5;
    el.style.cssText = `position:fixed;top:-12px;left:${left}vw;width:${size}px;height:${size*0.6}px;background:${colors[i%colors.length]};opacity:.95;border-radius:2px;z-index:300;pointer-events:none;`;
    document.body.appendChild(el);
    const duration = 1600+Math.random()*1200;
    const drift = (Math.random()-0.5)*220;
    const rotateEnd = 360+Math.random()*360;
    if(el.animate){
      el.animate([
        {transform:"translate(0,0) rotate(0deg)", opacity:1},
        {transform:`translate(${drift}px, 100vh) rotate(${rotateEnd}deg)`, opacity:.9}
      ], {duration, easing:"cubic-bezier(.2,.6,.4,1)"});
    }
    setTimeout(()=>el.remove(), duration+80);
  }
}
function captureFocus(){ const el=document.activeElement; if(!el||!el.id) return null; return {id:el.id, selStart:el.selectionStart, selEnd:el.selectionEnd}; }
function restoreFocus(info){ if(!info) return; const el=document.getElementById(info.id); if(el){ el.focus(); if(info.selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(info.selStart, info.selEnd); }catch(e){} } } }

function computeNotifications(){
  const today = new Date(new Date().toDateString());
  const soonLimit = new Date(today); soonLimit.setDate(soonLimit.getDate()+3);
  const items = [];
  state.projects.filter(p=>!p.archived).forEach(p=>{
    (p.etapes||[]).forEach(e=>{
      if(e.statut!=="Fait" && e.date){
        const d = new Date(e.date+"T00:00:00");
        if(d < today) items.push({type:"overdue", projetId:p.id, projetTitre:p.titre, texte:e.titre||"Étape", date:e.date});
        else if(d <= soonLimit) items.push({type:"soon", projetId:p.id, projetTitre:p.titre, texte:e.titre||"Étape", date:e.date});
      }
    });
  });
  items.sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  return items;
}

function readTimeChip(text){
  const words = (text||"").split(/\s+/).filter(Boolean).length;
  const mins = Math.max(1, Math.min(4, Math.ceil(words/40)));
  return `<span class="read-time">${iconClock(11)} ${mins} min de lecture</span>`;
}
function renderJournalSection(){
  const jd = state.journalData;
  const busy = state.journalBusy;

    <div class="journal-refresh-bar">
      <button type="button" class="btn btn-primary" data-action="refresh-journal" ${busy?'disabled':''}>${iconNewspaper(13)} ${busy?'Mise à jour du journal…':(jd?'Actualiser le journal':'Générer le journal')}</button>

    </div>
    ${state.journalError?`<p class="hint" style="color:var(--red);margin:-10px 0 16px;">${escapeHtml(state.journalError)}</p>`:''}`;

  if(!jd){
    return `<p style="font-size:12.5px;color:var(--text-3);margin:0 0 4px;">📰&nbsp; Un journal du marché, par rubrique, généré en un clic.</p>${refreshBar}${busy?'':`<p class="hint">Cliquez sur « Générer le journal » pour votre première édition.</p>`}`;
  }

  const activeSections = jd.sections.filter(s=>s.articles.length>0);
  const toc = activeSections.map((s,idx)=>{

    return `<a data-action="scroll-to" data-target="rubrique-${idx}">${def.emoji} ${escapeHtml(s.secteur)}</a>`;
  }).join("");

  const rubriques = activeSections.map((s,idx)=>{

    const cards = s.articles.map((a,ai)=>{
      const featured = ai===0;
      return `
      <div class="opp-card ${featured?'news-card-featured':''}">
        ${featured?`<span class="featured-badge">${iconStarFilled(10)} À la une</span>`:''}
        <div class="opp-card-top" style="background:${def.grad};">
          ${featured?`<span class="bg-emoji">${def.emoji}</span>`:''}

          <span class="sector-tag">${escapeHtml(s.secteur)}</span>

        <div class="opp-card-body">
          <p class="opp-card-title ${featured?'mag-serif':''}">${escapeHtml(a.titre||"Sans titre")}</p>
          ${readTimeChip(a.resume)}
          <p class="opp-card-resume">${escapeHtml(a.resume||"")}</p>
          ${a.sourceUrl?`<div class="opp-source">${iconExternal(11)} <a href="${a.sourceUrl}" target="_blank" rel="noopener">${escapeHtml(a.sourceNom||"Source")}</a></div>`:(a.sourceNom?`<div class="opp-source">${iconExternal(11)} ${escapeHtml(a.sourceNom)}</div>`:'')}

            <button type="button" class="th-btn-outline" style="flex:1;justify-content:center;display:flex;align-items:center;gap:6px;" data-action="journal-create-project" data-id="${a.id}">${iconPlus(12)} Créer un projet</button>
          </div>
        </div>
      </div>`;
    }).join("");
    return `
    <div class="journal-rubrique" id="rubrique-${idx}">
      <div class="carousel-head">
        <h2><span class="rubrique-num">${String(idx+1).padStart(2,'0')}</span> ${def.emoji} <span class="mag-serif">${escapeHtml(s.secteur)}</span></h2>
        <div class="carousel-controls">
          <button type="button" data-action="carousel-scroll" data-dir="-1" data-target="${trackId}">${iconChevLeft(15)}</button>

        </div>
      </div>
      <div class="carousel-track" id="${trackId}">${cards}</div>
    </div>`;
  }).join("");

  const mastheadDate = new Date().toLocaleDateString("fr-FR",{weekday:"long", day:"numeric", month:"long", year:"numeric"});
  return `
    <div class="mag-masthead">
      <p class="kicker">📰 Édition économique</p>
      <p class="title">Le Journal de Yond</p>
      <p class="sub">${mastheadDate.charAt(0).toUpperCase()+mastheadDate.slice(1)} · Sénégal &amp; Afrique de l'Ouest</p>
    </div>
    ${toc?`<div class="mag-toc">${toc}</div>`:''}

function renderTrackStats(list){
  const total = list.length;
  const enCours = list.filter(p=>p.statut==="En cours").length;
  const termines = list.filter(p=>p.statut==="Terminé").length;
  const overdue = list.filter(p=>p.dateFin && p.statut!=="Terminé" && p.statut!=="Abandonné" && new Date(p.dateFin) < new Date(new Date().toDateString())).length;
  const budgetPrev = list.reduce((s,p)=>s+(parseFloat(p.budgetPrevisionnel)||0),0);
  return `<div class="track-stats">
    <div class="track-stat" style="border-left-color:var(--blue-dot);"><span class="ic" style="background:var(--blue-bg);color:var(--blue);">${iconFolder(16)}</span><div><div class="l">${escapeHtml(tr('board_projects'))}</div><div class="v" data-countup="${total}">0</div></div></div>
    <div class="track-stat" style="border-left-color:var(--blue-dot);"><span class="ic" style="background:var(--blue-bg);color:var(--blue);">${iconBoardIcon(16)}</span><div><div class="l">${escapeHtml(tr('board_in_progress'))}</div><div class="v" style="color:var(--blue);" data-countup="${enCours}">0</div></div></div>
    <div class="track-stat" style="border-left-color:var(--green-dot);"><span class="ic" style="background:var(--green-bg);color:var(--green);">${iconCheckCircle()}</span><div><div class="l">${escapeHtml(tr('board_done'))}</div><div class="v" style="color:var(--green);" data-countup="${termines}">0</div></div></div>
    <div class="track-stat" style="border-left-color:${overdue>0?'var(--red-dot)':'var(--border-strong)'};"><span class="ic" style="background:${overdue>0?'var(--red-bg)':'var(--surface-2)'};color:${overdue>0?'var(--red)':'var(--text-faint)'};">${iconCalendar(16)}</span><div><div class="l">${escapeHtml(tr('board_overdue'))}</div><div class="v" style="color:${overdue>0?'var(--red)':'var(--text)'};" data-countup="${overdue}">0</div></div></div>
    <div class="track-stat" style="border-left-color:var(--amber-dot);"><span class="ic" style="background:var(--amber-bg);color:var(--amber);">${iconWallet(16)}</span><div><div class="l">${escapeHtml(tr('board_budget'))}</div><div class="v" style="font-size:15px;">${fmtMontant(budgetPrev)}</div></div></div>
  </div>`;
}

function cardHtml(p, idx){
  const dv = domainVisual(p.domaine);
  const prio = PRIORITE_META[p.priorite] || PRIORITE_META["Moyenne"];
  const pct = progressPct(p);
  const overdue = p.dateFin && p.statut!=="Terminé" && p.statut!=="Abandonné" && new Date(p.dateFin) < new Date(new Date().toDateString());
  const acteurs = (p.acteurs||[]).filter(a=>a.nom);
  const avatars = acteurs.slice(0,3).map(a=>`<span class="avatar" style="background:${avatarColor(a.nom)};" title="${escapeHtml(a.nom)}">${initials(a.nom)}</span>`).join("");
  const more = acteurs.length>3 ? `<span class="more">+${acteurs.length-3}</span>` : "";
  let coverHtml = "";
  if(p.coverImageId){
    if(state.imagesByProject[p.id]===undefined) ensureImagesLoaded(p.id);
    const imgs = state.imagesByProject[p.id];
    const cover = Array.isArray(imgs) ? imgs.find(i=>i.id===p.coverImageId) : null;
    if(cover) coverHtml = `<img class="k-cover" src="${cover.dataUrl}" alt="" />`;
  }
  const labelStrip = (p.labels||[]).length ? `<div class="k-label-strip">${(p.labels||[]).map(lid=>{ const l=LABEL_DEFS.find(x=>x.id===lid); return l?`<span style="background:${l.color};" title="${escapeHtml(l.name)}"></span>`:''; }).join("")}</div>` : "";
  const progressColor = pct>=100 ? "var(--green-dot)" : pct>=50 ? "var(--blue-dot)" : "var(--amber-dot)";
  return `
  <div class="k-card stagger-in" style="animation-delay:${(idx||0)*35}ms;border-left-color:${prio.color};" draggable="true" data-action="open-project" data-id="${p.id}" data-drag-id="${p.id}">
    ${p.favori?`<span class="k-star">${iconStarFilled(15)}</span>`:''}
    ${coverHtml}
    ${labelStrip}
    <div class="k-card-top">
      <span class="k-domicon" style="background:${dv.bg};color:${dv.c};">${dv.icon()}</span>
      <span class="k-code">${escapeHtml(p.code||'')}</span>
      <span class="k-prio" style="color:${prio.color};" title="Priorité ${escapeHtml((p.priorite||'').toLowerCase())}">${prio.icon()}</span>
    </div>
    <div class="k-card-title">${escapeHtml(p.titre || "Sans titre")}</div>
    ${p.domaine ? `<span class="k-chip" style="background:${dv.bg};color:${dv.c};">${escapeHtml(p.domaine)}</span>` : ''}
    ${(p.etapes||[]).length>0 ? `<div class="k-progress-row"><div class="k-progress"><div class="k-progress-bar" style="width:${pct}%;background:${progressColor};"></div></div><span class="k-progress-pct">${pct}%</span></div>` : ''}
    <div class="k-card-footer">
      <span class="k-due ${overdue?'overdue':''}">${overdue?'⚠️ ':''}${iconCalendar(12)} ${fmtDateShort(p.dateFin)}</span>
      ${parseFloat(p.budgetPrevisionnel)>0 ? `<span class="k-budget">${iconWallet(11)} ${fmtMontant(p.budgetPrevisionnel)}</span>` : ''}
      <span class="k-avatars">${avatars}${more}</span>
    </div>
  </div>`;
}

/* ---------------- list view ---------------- */
function renderListView(){
  if(state.projects.length===0) return renderEmptyState();
  let list = filteredProjects();
  const sort = state.listSort || {key:"none", dir:1};
  if(sort.key!=="none"){
    list = [...list].sort((a,b)=>{
      let av, bv;
      if(sort.key==="titre"){ av=(a.titre||"").toLowerCase(); bv=(b.titre||"").toLowerCase(); }
      else if(sort.key==="statut"){ av=STATUTS.indexOf(a.statut); bv=STATUTS.indexOf(b.statut); }
      else if(sort.key==="priorite"){ av=PRIORITES.indexOf(a.priorite); bv=PRIORITES.indexOf(b.priorite); }
      else if(sort.key==="dateFin"){ av=a.dateFin||"9999"; bv=b.dateFin||"9999"; }
      else if(sort.key==="budget"){ av=parseFloat(a.budgetPrevisionnel)||0; bv=parseFloat(b.budgetPrevisionnel)||0; }
      else { av=0; bv=0; }
      if(av<bv) return -1*sort.dir; if(av>bv) return 1*sort.dir; return 0;
    });
  }
  const today = new Date(new Date().toDateString());
  const sortArrow = (key) => sort.key===key ? `<span class="sort-arrow">${sort.dir===1?'▲':'▼'}</span>` : "";
  const rows = list.map(p=>{
    const meta = STATUT_META[p.statut]||STATUT_META["Planifié"];
    const prio = PRIORITE_META[p.priorite]||PRIORITE_META["Moyenne"];
    const dv = domainVisual(p.domaine);
    const pct = progressPct(p);
    const progressColor = pct>=100 ? "var(--green-dot)" : pct>=50 ? "var(--blue-dot)" : "var(--amber-dot)";
    const overdue = p.dateFin && p.statut!=="Terminé" && p.statut!=="Abandonné" && new Date(p.dateFin) < today;
    const acteurs = (p.acteurs||[]).filter(a=>a.nom);
    const avatars = acteurs.slice(0,3).map(a=>`<span class="avatar" style="background:${avatarColor(a.nom)};width:22px;height:22px;font-size:10px;margin-left:-7px;border:2px solid var(--surface);" title="${escapeHtml(a.nom)}">${initials(a.nom)}</span>`).join("");
    return `
    <tr class="l-row ${overdue?'overdue-row':''}" data-action="open-project" data-id="${p.id}" style="border-left-color:${prio.color};">
      <td><div class="l-title-cell">${p.favori?`<span style="color:#FF991F;">${iconStarFilled(13)}</span>`:''}<span class="k-domicon" style="background:${dv.bg};color:${dv.c};">${dv.icon()}</span><span class="code">${escapeHtml(p.code||'')}</span><span class="title">${escapeHtml(p.titre||"Sans titre")}</span></div></td>
      <td>${escapeHtml(p.domaine||"—")}</td>
      <td><span class="lozenge" style="color:${meta.color};background:${meta.bg};">${escapeHtml(trStatut(p.statut))}</span></td>
      <td><span style="display:inline-flex;align-items:center;gap:5px;color:${prio.color};font-size:12.5px;font-weight:600;">${prio.icon()}${escapeHtml(trPriorite(p.priorite))}</span></td>
      <td>${(p.etapes||[]).length>0 ? `<span class="l-mini-progress"><span class="l-mini-progress-bar" style="width:${pct}%;background:${progressColor};display:block;"></span></span><span style="font-family:var(--mono);font-size:11px;color:var(--text-3);">${pct}%</span>` : '<span style="color:var(--text-faint);font-size:11px;">—</span>'}</td>
      <td style="font-family:var(--mono);font-size:12px;${overdue?'color:var(--red);font-weight:700;':'color:var(--text-3);'}">${overdue?'⚠️ ':''}${fmtDate(p.dateFin)}</td>
      <td style="font-family:var(--mono);font-size:12px;">${fmtMontant(p.budgetPrevisionnel)}</td>
      <td><span class="k-avatars">${avatars||'<span style="color:var(--text-faint);font-size:11px;">—</span>'}</span></td>
    </tr>`;
  }).join("");
  return `${renderTrackStats(list)}<div id="list-view"><table class="l-table">
    <thead><tr>
      <th data-action="sort-list" data-key="titre">Projet ${sortArrow("titre")}</th>
      <th>Domaine</th>
      <th data-action="sort-list" data-key="statut">Statut ${sortArrow("statut")}</th>
      <th data-action="sort-list" data-key="priorite">Priorité ${sortArrow("priorite")}</th>
      <th>Avancement</th>
      <th data-action="sort-list" data-key="dateFin">Échéance ${sortArrow("dateFin")}</th>
      <th data-action="sort-list" data-key="budget">Budget ${sortArrow("budget")}</th>
      <th>Acteurs</th>
    </tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function sectionResume(p){

  const overdueEtapes = (p.etapes||[]).filter(e=>e.statut!=="Fait" && e.date && new Date(e.date) < today).length;
  const overBudget = budgetPrev>0 && (parseFloat(p.budgetReel)||0) > budgetPrev;
  const projectOverdue = p.dateFin && p.statut!=="Terminé" && p.statut!=="Abandonné" && new Date(p.dateFin) < today;
  let health;
  if(p.statut==="Terminé") health = {icon:"🏆", text:"Projet terminé", color:"#006644", bg:"#E3FCEF"};
  else if(overdueEtapes>0 || overBudget || projectOverdue) health = {icon:"🔴", text:"Attention requise", color:"#BF2600", bg:"#FFEBE6"};
  else if((p.etapes||[]).length===0 && !p.description) health = {icon:"⚪", text:"À démarrer", color:"#42526E", bg:"#DFE1E6"};
  else health = {icon:"🟢", text:"En bonne voie", color:"#006644", bg:"#E3FCEF"};

function computeGanttRange(p){
  const dates = [];
  if(p.dateDebut) dates.push(new Date(p.dateDebut+"T00:00:00"));
  if(p.dateFin) dates.push(new Date(p.dateFin+"T00:00:00"));
  (p.etapes||[]).forEach(e=>{
    if(e.dateDebut) dates.push(new Date(e.dateDebut+"T00:00:00"));
    if(e.date) dates.push(new Date(e.date+"T00:00:00"));
  });
  if(dates.length===0) return null;
  let min = new Date(Math.min(...dates)), max = new Date(Math.max(...dates));
  if(min.getTime()===max.getTime()) max.setDate(max.getDate()+7);
  min.setDate(min.getDate()-1); max.setDate(max.getDate()+1);
  return {min, max};
}
function renderGanttSection(p){
  const etapes = (p.etapes||[]);
  const range = computeGanttRange(p);
  if(!range || etapes.filter(e=>e.date||e.dateDebut).length===0){
    return `<div class="gantt-wrap"><p class="hint">📊 Ajoutez une date à au moins une étape pour voir apparaître le diagramme de Gantt.</p></div>`;
  }
  const totalMs = range.max - range.min;
  const rowH = 32, leftW = 150, chartW = 460, headerH = 24;
  const withDates = etapes.filter(e=>e.date||e.dateDebut);
  const height = headerH + withDates.length*rowH + 8;
  const xFor = (d) => leftW + ((new Date(d+"T00:00:00") - range.min)/totalMs) * chartW;

  const tickCount = 4;
  const ticks = Array.from({length:tickCount+1}, (_,i)=> new Date(range.min.getTime() + (totalMs*i/tickCount)));
  const ticksHtml = ticks.map(d=>`<text x="${leftW+((d-range.min)/totalMs)*chartW}" y="15" font-size="9.5" fill="#6B778C" text-anchor="middle" font-family="Inter,sans-serif">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</text>`).join("");
  const gridHtml = ticks.map(d=>`<line x1="${leftW+((d-range.min)/totalMs)*chartW}" y1="${headerH}" x2="${leftW+((d-range.min)/totalMs)*chartW}" y2="${height}" stroke="#EBECF0" stroke-width="1"/>`).join("");
  const today = new Date(new Date().toDateString());
  const todayLine = (today>=range.min && today<=range.max)
    ? `<line x1="${xFor(today.toISOString().slice(0,10))}" y1="${headerH}" x2="${xFor(today.toISOString().slice(0,10))}" y2="${height}" stroke="#DE350B" stroke-width="1.5" stroke-dasharray="3,3"/>`
    : "";

  const rowsHtml = withDates.map((e,i)=>{
    const y = headerH + i*rowH;
    const color = e.statut==="Fait" ? "#36B37E" : e.statut==="En cours" ? "#4C9AFF" : "#8993A4";
    const label = `<text x="6" y="${y+rowH/2+4}" font-size="11" fill="#172B4D" font-family="Inter,sans-serif">${escapeHtml((e.titre||"Étape").slice(0,20))}</text>`;
    let bar = "";
    if(e.date && e.dateDebut){
      const x1 = xFor(e.dateDebut), x2 = xFor(e.date);
      const w = Math.max(8, Math.abs(x2-x1));
      bar = `<rect x="${Math.min(x1,x2)}" y="${y+7}" width="${w}" height="14" rx="4" fill="${color}"><title>${escapeHtml(e.titre||"")}: ${fmtDateShort(e.dateDebut)} → ${fmtDateShort(e.date)}</title></rect>`;
    } else if(e.date){
      const x = xFor(e.date);
      bar = `<polygon points="${x},${y+6} ${x+7},${y+14} ${x},${y+22} ${x-7},${y+14}" fill="${color}"><title>${escapeHtml(e.titre||"")}: ${fmtDateShort(e.date)}</title></polygon>`;
    }
    return `<g>${label}${bar}</g>`;
  }).join("");

  return `<div class="gantt-wrap">
    <div style="overflow-x:auto;">
      <svg width="${leftW+chartW+16}" height="${height}" viewBox="0 0 ${leftW+chartW+16} ${height}">
        ${ticksHtml}${gridHtml}${todayLine}${rowsHtml}
      </svg>
    </div>
    <div class="gantt-legend">
      <span><i style="background:#8993A4;"></i>À faire</span>
      <span><i style="background:#4C9AFF;"></i>En cours</span>
      <span><i style="background:#36B37E;"></i>Fait</span>
      <span><i style="background:#DE350B;width:2px;height:12px;border-radius:0;"></i>Aujourd'hui</span>
    </div>
  </div>`;
}

function sectionSchema(p){

  if(p.diagramAutoSync!==false){
    const changed = syncDiagramWithProject(p);
    if(changed) scheduleSaveProjects();
  }
  const imgs = state.imagesByProject[p.id];
  if(imgs===undefined) ensureImagesLoaded(p.id);
  const hasImages = Array.isArray(imgs) && imgs.length>0;

  const maxX = p.diagram.blocks.length ? Math.max(900, ...p.diagram.blocks.map(b=>(b.x||0)+BLOCK_W+60)) : 900;
  const maxY = p.diagram.blocks.length ? Math.max(480, ...p.diagram.blocks.map(b=>(b.y||0)+BLOCK_H_EST+60)) : 480;

  const typeButtons = Object.keys(BLOCK_TYPES).map(k=>{
    const m = BLOCK_TYPES[k];
    return `<button type="button" class="btn" data-action="add-block" data-type="${k}" style="color:${m.color};">${m.icon()} ${m.label}</button>`;
  }).join("");

  const blocksHtml = p.diagram.blocks.map(b=>{
    const meta = BLOCK_TYPES[b.type]||BLOCK_TYPES.note;
    const imgs2 = Array.isArray(imgs) ? imgs : [];
    const thumb = b.imageId && imgs2.find(i=>i.id===b.imageId);
    const imgOptions = imgs2.map(im=>`<option value="${im.id}" ${b.imageId===im.id?'selected':''}>${escapeHtml((im.caption||im.name||'image').slice(0,24))}</option>`).join("");
    return `

    </div>`;
  }).join("");

  const edgesList = p.diagram.edges.map(e=>{

  return `

async function callClaudeAPI(promptText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: promptText }],
    }),
  });
  if(!response.ok) throw new Error("HTTP "+response.status);
  const data = await response.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function callClaudeAPIWithSearch(promptText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: promptText }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if(!response.ok) throw new Error("HTTP "+response.status);
  const data = await response.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function miniMarkdownToHtml(md){
  let html = escapeHtml(md||"");
  html = html.replace(/^### (.*)$/gm, "<h4>$1</h4>");
  html = html.replace(/^## (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^# (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^[-*] (.*)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => "<ul>"+m+"</ul>");
  html = html.split(/\n{2,}/).map(block=>{
    if(/^<h\d|^<ul/.test(block.trim())) return block;
    return block.trim() ? `<p>${block.trim().replace(/\n/g,"<br>")}</p>` : "";
  }).join("");
  return html;
}
function tryCopyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }catch(e){}
}

function downloadWordDoc(p){
  const body = buildReportHTML(p);
  const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${escapeHtml(p.titre||"Compte-rendu")}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
  <style>body{margin:24px;} table{border-collapse:collapse;}</style>
  </head><body>${body}</body></html>`;
  const blob = new Blob(["\ufeff", doc], {type:"application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = ("compte-rendu-"+(p.titre||"projet")).replace(/[^a-z0-9-_]+/gi,"_")+".doc";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function openPrintPreview(p){
  const body = buildReportHTML(p);
  const win = window.open("", "_blank");
  if(!win){ window.alert("Autorisez les fenêtres pop-up pour afficher l'aperçu à imprimer."); return; }
  win.document.open();
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(p.titre||"Compte-rendu")}</title>
    <style>
      @media print{ .no-print{ display:none; } @page{ margin:14mm; } }
      body{ background:#F4F5F7; margin:0; padding:26px; }
    </style>
  </head><body>
    <div class="no-print" style="max-width:760px;margin:0 auto 16px;">
      <button onclick="window.print()" style="background:#2D6A4F;color:#fff;border:none;border-radius:6px;padding:10px 16px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;cursor:pointer;">🖨️ Imprimer / Enregistrer en PDF</button>
    </div>
    ${body}
  </body></html>`);
  win.document.close();
}

}

function renderLogin(){
  const mode = state.authMode;
  const busy = state.authBusy;
  const features = [
    {em:"💰", t:"Budget & financement suivis à la source"},
    {em:"👥", t:"Acteurs, rôles et contacts centralisés"},
    {em:"🧩", t:"Schémas structurels et étapes claires"},
    {em:"✨", t:"Assistant IA à chaque étape du projet"},
    {em:"🔒", t:"Vos données, liées à votre seul compte"},
  ].map(f=>`<div class="lf"><span class="em">${f.em}</span>${f.t}</div>`).join("");

  return `
  <div id="login-shell">
    <div class="lang-switch lang-switch-login">
      <button type="button" class="${state.lang==='fr'?'active':''}" data-action="set-lang" data-value="fr">FR</button>
      <button type="button" class="${state.lang==='en'?'active':''}" data-action="set-lang" data-value="en">EN</button>
    </div>
    <span class="bg-shape" style="width:220px;height:220px;top:-60px;left:-60px;background:radial-gradient(circle,rgba(45,156,219,.35),transparent 70%);animation-delay:.3s;"></span>
    <span class="bg-shape" style="width:180px;height:180px;bottom:-40px;right:6%;background:radial-gradient(circle,rgba(255,184,107,.3),transparent 70%);animation-delay:1.4s;"></span>
    <div class="login-wrap">
      <div class="login-side">
        <span class="login-side-shape" style="width:70px;height:70px;top:20px;right:-10px;background:rgba(255,184,107,.18);animation-delay:.5s;"></span>
        <span class="login-side-shape" style="width:40px;height:40px;bottom:120px;right:30px;background:rgba(45,156,219,.22);animation-delay:1.6s;"></span>
        <div class="login-side-content">
          <div class="brand"><span class="mark">${iconYondLogo(20)}</span><span class="name">Yond</span></div>
          <h2>${escapeHtml(greetingNow().text)} 👋</h2>
          <p class="sub">Connectez-vous pour retrouver vos projets, où que vous soyez — vos données vous suivent, sur n'importe quelle machine.</p>
        </div>
        <div class="login-feature-list">${features}</div>
      </div>
      <div class="login-form-side">
        <div class="login-form-head">
          <h1>${mode==="signin"?"Se connecter":"Créer un compte"}</h1>
          <p>${mode==="signin"?"Heureux de vous revoir 🙂":"Ça prend 30 secondes ⏱️"}</p>
        </div>
        ${state.authError?`<div class="login-error">⚠️ ${escapeHtml(state.authError)}</div>`:''}
        <button type="button" class="login-google" data-action="auth-google" ${busy?'disabled':''}>${iconGoogleLogo(18)} Continuer avec Google</button>
        <div class="login-sep">ou avec un email</div>
        <div class="login-field"><label>✉️ Email</label><input class="f" type="email" id="auth-email" placeholder="vous@exemple.com" /></div>
        <div class="login-field"><label>🔑 Mot de passe</label><input class="f" type="password" id="auth-password" placeholder="••••••••" /></div>
        <label class="login-remember"><input type="checkbox" id="auth-remember" checked /> Rester connecté sur cet appareil</label>
        ${mode==="signin"?`<button type="button" class="login-forgot" data-action="auth-reset">Mot de passe oublié ?</button>`:''}
        <button type="button" class="btn btn-primary btn-block" data-action="auth-submit" ${busy?'disabled':''}>${busy?'Un instant…':(mode==="signin"?"✅ Se connecter":"🚀 Créer mon compte")}</button>
        <p class="login-switch">
          ${mode==="signin"
            ? `Pas encore de compte ? <button type="button" data-action="auth-toggle-mode">Créer un compte</button>`
            : `Déjà un compte ? <button type="button" data-action="auth-toggle-mode">Se connecter</button>`}
        </p>
        <p class="login-trust">🔐 Connexion sécurisée via Firebase</p>
      </div>
    </div>
  </div>`;
}

async function applyPersistence(){
  const remember = (document.getElementById("auth-remember")||{}).checked;
  const mode = remember===false
    ? firebase.auth.Auth.Persistence.SESSION
    : firebase.auth.Auth.Persistence.LOCAL;
  try{ await auth.setPersistence(mode); }catch(e){ /* older browsers / private mode: ignore */ }
}
async function handleAuthSubmit(){
  const email = (document.getElementById("auth-email")||{}).value || "";
  const password = (document.getElementById("auth-password")||{}).value || "";
  if(!email.trim() || !password){ state.authError = "Renseignez un email et un mot de passe."; render(); return; }
  state.authBusy = true; state.authError = null; render();
  try{
    await applyPersistence();
    if(state.authMode==="signin") await auth.signInWithEmailAndPassword(email.trim(), password);
    else await auth.createUserWithEmailAndPassword(email.trim(), password);
    // onAuthStateChanged takes over from here
  }catch(e){
    state.authBusy = false;
    state.authError = authErrorMessage(e);
    render();
  }
}
async function handleAuthGoogle(){
  state.authBusy = true; state.authError = null; render();
  try{
    await applyPersistence();
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }catch(e){
    state.authBusy = false;
    state.authError = authErrorMessage(e);
    render();
  }
}
async function handleAuthReset(){
  const email = (document.getElementById("auth-email")||{}).value || "";
  if(!email.trim()){ state.authError = "Indiquez votre email pour réinitialiser le mot de passe."; render(); return; }
  try{
    await auth.sendPasswordResetEmail(email.trim());
    state.authError = null;
    showToastSafe("Email de réinitialisation envoyé.");
  }catch(e){ state.authError = authErrorMessage(e); render(); }
}
function authErrorMessage(e){
  const code = e && e.code || "";
  const map = {
    "auth/invalid-email": "Adresse email invalide.",
    "auth/user-not-found": "Aucun compte avec cet email.",
    "auth/wrong-password": "Mot de passe incorrect.",
    "auth/invalid-credential": "Email ou mot de passe incorrect.",
    "auth/email-already-in-use": "Un compte existe déjà avec cet email.",
    "auth/weak-password": "Mot de passe trop court (6 caractères minimum).",
    "auth/popup-closed-by-user": "Connexion annulée.",
    "auth/network-request-failed": "Problème réseau. Réessayez.",
  };
  return map[code] || "Une erreur est survenue. Réessayez.";
}
function showToastSafe(text, type){
  const stack = document.getElementById("toast-stack");
  if(stack) showToast(text, type);
  else window.alert(text);
