/* ======================================================================
   Event delegation
   ====================================================================== */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;

  if(action==="auth-google"){ handleAuthGoogle(); return; }
  else if(action==="auth-submit"){ handleAuthSubmit(); return; }
  else if(action==="auth-reset"){ handleAuthReset(); return; }
  else if(action==="auth-toggle-mode"){ state.authMode = state.authMode==="signin"?"signup":"signin"; state.authError=null; render(); return; }
  else if(action==="auth-signout"){ auth.signOut(); return; }
  else if(action==="set-lang"){ setLang(t.dataset.value); return; }
  else if(action==="change-password"){ handleChangePassword(); return; }
  else if(action==="goto-backup"){
    state.view="home"; render();
    setTimeout(()=>{ const el=document.getElementById("backup-section"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }, 50);
  }
  else if(action==="go-home"){
    state.drawerOpen = false; state.view = "home";
    state.query = ""; state.prioFilter = "Toutes";
    render();
    setTimeout(()=>{ state.activeId = null; }, 200);
  }
  else if(action==="create-project"){ state.showNewProjectModal=true; state.newProjectMode="ai"; state.aiCreateError=null; render(); }
  else if(action==="create-template"){ createTemplateProject(t.dataset.domaine); }
  else if(action==="scroll-to"){ const el=document.getElementById(t.dataset.target); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if(action==="quick-add") createProject(t.dataset.statut);
  else if(action==="np-mode"){ state.newProjectMode = t.dataset.value; render(); }
  else if(action==="np-cancel" || action==="close-new-project-modal"){ if(!state.aiCreateBusy){ state.showNewProjectModal=false; render(); } }
  else if(action==="np-create-blank"){ state.showNewProjectModal=false; createProject("Planifié"); }
  else if(action==="np-create-ai"){
    if(state.aiCreateBusy) return;
    const ta = document.getElementById("np-description");
    const desc = ta ? ta.value.trim() : "";
    if(!desc){ state.aiCreateError = "Décrivez votre projet en quelques mots pour que l'IA puisse le créer."; render(); return; }
    state.aiCreateBusy = true; state.aiCreateError = null; render();
    createProjectFromDescription(desc)
      .then(()=>{ state.aiCreateBusy=false; state.showNewProjectModal=false; render(); showToast("✨ Projet créé par l'IA", "success"); })
      .catch(()=>{ state.aiCreateBusy=false; state.aiCreateError="L'IA n'a pas pu créer le projet. Réessayez ou créez-le manuellement."; render(); });
  }
  else if(action==="dismiss-ai-banner"){ state.aiJustCreatedId=null; render(); }
  else if(action==="dismiss-intro"){ setIntroDismissed(true); render(); }
  else if(action==="reopen-intro"){ setIntroDismissed(false); render(); }
  else if(action==="ai-report"){
    const p = getActive();
    if(!p || state.aiBusy) return;
    state.aiBusy = true; state.aiError=null; render();
    generateProjectReport(p)
      .then(()=>{ state.aiBusy=false; render(); showToast("📄 Compte-rendu généré", "success"); })
      .catch(()=>{ state.aiBusy=false; state.aiError="Le compte-rendu n'a pas pu être généré. Réessayez."; render(); });
  }
  else if(action==="download-report"){
    const p = getActive(); if(!p || !p.lastReport) return;
    const blob = new Blob([p.lastReport.text], {type:"text/markdown"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=("compte-rendu-"+(p.titre||"projet")).replace(/[^a-z0-9-_]+/gi,"_")+".md";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  else if(action==="copy-report"){ const p=getActive(); if(p && p.lastReport) tryCopyText(p.lastReport.text); }
  else if(action==="download-word"){ const p=getActive(); if(p) downloadWordDoc(p); }
  else if(action==="open-print-preview"){ const p=getActive(); if(p) openPrintPreview(p); }
  else if(action==="open-project"){ state.activeId = t.dataset.id; state.drawerOpen = true; state.tab="resume"; state.linkMode=false; state.linkSource=null; render(); }
  else if(action==="close-drawer"){ state.drawerOpen = false; render(); setTimeout(()=>{ state.activeId=null; },200); }
  else if(action==="set-view"){ state.view = t.dataset.value; render(); }
  else if(action==="filter-prio"){ state.prioFilter = t.dataset.value; render(); }
  else if(action==="toggle-archived"){ state.showArchived = !state.showArchived; render(); }
  else if(action==="sort-list"){
    const key = t.dataset.key;
    if(state.listSort.key===key) state.listSort.dir *= -1;
    else state.listSort = {key, dir:1};
    render();
  }
  else if(action==="set-news-sector"){ state.newsSectorFilter = t.dataset.value; render(); }
  else if(action==="run-news-search"){
    if(state.newsBusy) return;
    const custom = (document.getElementById("news-custom-sector")||{}).value || "";
    state.newsCustomSector = custom.trim();
    const sector = state.newsCustomSector || state.newsSectorFilter;
    state.newsBusy = true; state.newsError = null; render();
    researchOpportunities(sector)
      .then(()=>{ state.newsBusy=false; render(); })
      .catch(()=>{ state.newsBusy=false; state.newsError="La recherche n'a pas abouti. Réessayez dans un instant."; render(); });
  }
  else if(action==="refresh-journal"){
    if(state.journalBusy) return;
    state.journalBusy = true; state.journalError = null; render();
    requestJournal()
      .then(()=>{ state.journalBusy=false; render(); showToast("📰 Journal mis à jour", "success"); })
      .catch(()=>{ state.journalBusy=false; state.journalError="Le journal n'a pas pu être généré. Réessayez."; render(); });
  }
  else if(action==="journal-create-project"){
    const jd = state.journalData;
    let article = null, sector = "";
    if(jd) for(const s of jd.sections){ const found = s.articles.find(a=>a.id===t.dataset.id); if(found){ article=found; sector=s.secteur; break; } }
    if(!article) return;
    const desc = `${article.titre}. ${article.resume} Secteur : ${sector}.`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); showToast("✨ Projet créé depuis une actualité", "success"); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="suggest-ideas"){
    if(state.ideaSuggBusy) return;
    const steer = (document.getElementById("idea-sugg-steer")||{}).value || "";
    state.ideaSuggInput = steer.trim();
    state.ideaSuggBusy = true; state.ideaSuggError = null; render();
    requestIdeaSuggestions(state.ideaSuggInput)
      .then(()=>{ state.ideaSuggBusy=false; render(); showToast("💡 Nouvelles idées suggérées", "success"); })
      .catch(()=>{ state.ideaSuggBusy=false; state.ideaSuggError="Les suggestions n'ont pas pu être générées. Réessayez."; render(); });
  }
  else if(action==="idea-sugg-create"){
    const sugg = state.ideaSuggestions; const idea = sugg && sugg.ideas.find(x=>x.id===t.dataset.id);
    if(!idea) return;
    const desc = `${idea.titre}. ${idea.description} Domaine : ${idea.domaine}.`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); showToast("✨ Projet créé depuis une suggestion", "success"); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="example-inspire-create"){
    const sugg = state.ideaSuggestions; const ex = sugg && sugg.examples && sugg.examples.find(x=>x.id===t.dataset.id);
    if(!ex) return;
    const desc = `Un projet inspiré de "${ex.nom}"${ex.lieu?' ('+ex.lieu+')':''}. ${ex.description} Facteurs de succès observés : ${ex.facteursSucces||"non précisés"}.`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); showToast("✨ Projet créé, inspiré d'un exemple réel", "success"); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="add-my-idea"){
    if(state.myIdeaBusy) return;
    const titre = ((document.getElementById("myidea-titre")||{}).value||"").trim();
    const description = ((document.getElementById("myidea-description")||{}).value||"").trim();
    if(!titre && !description) return;
    const idea = {id:uid(), titre: titre||description.slice(0,60), description, evaluation:null, date:new Date().toISOString()};
    state.myIdeas.unshift(idea);
    scheduleSaveMyIdeas();
    state.myIdeaBusy = "new"; state.myIdeaError=null; render();
    analyzeMyIdea(idea)
      .then(()=>{ state.myIdeaBusy=null; render(); showToast("🤔 Idée analysée", "success"); })
      .catch(()=>{ state.myIdeaBusy=null; state.myIdeaError="L'analyse a échoué. Réessayez avec le bouton sur la carte."; render(); });
  }
  else if(action==="reanalyze-my-idea"){
    if(state.myIdeaBusy) return;
    const idea = state.myIdeas.find(x=>x.id===t.dataset.id);
    if(!idea) return;
    state.myIdeaBusy = idea.id; state.myIdeaError=null; render();
    analyzeMyIdea(idea)
      .then(()=>{ state.myIdeaBusy=null; render(); showToast("🤔 Idée analysée", "success"); })
      .catch(()=>{ state.myIdeaBusy=null; state.myIdeaError="L'analyse a échoué. Réessayez."; render(); });
  }
  else if(action==="del-my-idea"){ state.myIdeas = state.myIdeas.filter(x=>x.id!==t.dataset.id); scheduleSaveMyIdeas(); render(); }
  else if(action==="my-idea-create-project"){
    const idea = state.myIdeas.find(x=>x.id===t.dataset.id);
    if(!idea) return;
    const desc = `${idea.titre}. ${idea.description}`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); showToast("✨ Projet créé depuis votre idée", "success"); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="carousel-scroll"){
    const el = document.getElementById(t.dataset.target);
    if(el){ const card = el.querySelector(".opp-card, .idea-card"); const w = card ? card.offsetWidth+16 : 300; el.scrollBy({left: (+t.dataset.dir)*w, behavior:"smooth"}); }
  }
  else if(action==="toggle-autoplay"){
    state.carouselPlaying = !state.carouselPlaying;
    if(state.carouselPlaying){
      clearInterval(carouselTimer);
      carouselTimer = setInterval(()=>{
        const el = document.getElementById("opp-track");
        if(!el) return;
        const card = el.querySelector(".opp-card");
        const w = card ? card.offsetWidth+16 : 300;
        if(el.scrollLeft + el.clientWidth >= el.scrollWidth - 4) el.scrollTo({left:0, behavior:"smooth"});
        else el.scrollBy({left:w, behavior:"smooth"});
      }, 3500);
    } else { clearInterval(carouselTimer); }
    render();
  }
  else if(action==="add-idea"){
    const titre = (document.getElementById("idea-titre")||{}).value || "";
    const secteur = (document.getElementById("idea-secteur")||{}).value || "Événementiel";
    const description = (document.getElementById("idea-description")||{}).value || "";
    if(!titre.trim() && !description.trim()) return;
    state.ideas.unshift({id:uid(), titre:titre.trim(), secteur, description:description.trim(), date:new Date().toISOString()});
    state.ideaForm = {titre:"", secteur:"Événementiel", description:""};
    scheduleSaveNews(); render();
  }
  else if(action==="del-idea"){ state.ideas = state.ideas.filter(i=>i.id!==t.dataset.id); scheduleSaveNews(); render(); }
  else if(action==="opp-create-project"){
    const nd = state.newsData; const o = nd && nd.opportunities.find(x=>x.id===t.dataset.id);
    if(!o) return;
    const desc = `${o.titre}. ${o.resume} ${o.potentiel} Secteur : ${o.secteur}.${o.budget?(" Budget de départ estimé : "+o.budget+".") : ""}`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="idea-create-project"){
    const idea = state.ideas.find(x=>x.id===t.dataset.id);
    if(!idea) return;
    const desc = `${idea.titre}. ${idea.description} Secteur : ${idea.secteur}.`;
    state.aiCreateBusy = true; render();
    createProjectFromDescription(desc).then(()=>{ state.aiCreateBusy=false; render(); }).catch(()=>{ state.aiCreateBusy=false; render(); });
  }
  else if(action==="set-tab"){ state.tab = t.dataset.tab; if(state.tab!=="schema"){ state.linkMode=false; state.linkSource=null; } render(); }
  else if(action==="ask-delete-project"){ state.confirmDeleteId = state.activeId; render(); }
  else if(action==="ask-delete-project-id"){ state.confirmDeleteId = t.dataset.id; render(); }
  else if(action==="cancel-delete" || action==="close-modal-bg"){ state.confirmDeleteId = null; render(); }
  else if(action==="confirm-delete"){ deleteProject(state.confirmDeleteId); }
  else if(action==="toggle-favori"){ const p=getActive(); if(p){ p.favori=!p.favori; scheduleSaveProjects(); render(); showToast(p.favori?"⭐ Ajouté aux favoris":"Retiré des favoris", "info"); } }
  else if(action==="toggle-archive"){ const p=getActive(); if(p){ p.archived=!p.archived; scheduleSaveProjects(); render(); showToast(p.archived?"📦 Projet archivé":"Projet restauré", "info"); } }
  else if(action==="duplicate-project"){ if(state.activeId) duplicateProject(state.activeId); }
  else if(action==="export-data"){ exportAllData(); }
  else if(action==="import-data"){ const inp=document.getElementById("import-file-input"); if(inp) inp.click(); }
  else if(action==="toggle-notifs"){ state.notifOpen = !state.notifOpen; render(); }
  else if(action==="notif-open-project"){ state.notifOpen=false; state.activeId=t.dataset.id; state.drawerOpen=true; state.tab="deroulement"; render(); }
  else if(action==="cal-prev-month"){ const d=state.calDate; state.calDate=new Date(d.getFullYear(), d.getMonth()-1, 1); render(); }
  else if(action==="cal-next-month"){ const d=state.calDate; state.calDate=new Date(d.getFullYear(), d.getMonth()+1, 1); render(); }
  else if(action==="cal-today"){ const n=new Date(); state.calDate=new Date(n.getFullYear(), n.getMonth(), 1); render(); }
  else if(action==="doc-new-page"){
    const p = {id:uid(), titre:"Nouvelle page", categorie:state.docCategory||"Documentation", contenu:"", createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()};
    state.docPages.unshift(p);
    state.activeDocId = p.id;
    scheduleSaveDocs(); render();
  }
  else if(action==="doc-select"){ state.activeDocId = t.dataset.id; render(); }

/* ---- schema block dragging ---- */
let schemaDrag = null;
let carouselTimer = null;
document.addEventListener("mousedown", (e)=>{
  const handle = e.target.closest("[data-drag-handle]");
  if(!handle) return;
  const id = handle.dataset.dragHandle;
  const p = getActive(); if(!p) return;
  const block = (p.diagram.blocks||[]).find(b=>b.id===id);
  if(!block) return;
  const canvas = document.getElementById("schema-canvas");
  const svg = document.getElementById("schema-svg");
  const touchedLines = svg ? Array.from(svg.querySelectorAll(`line[data-from="${id}"], line[data-to="${id}"]`)) : [];
  schemaDrag = {
    id, block, startClientX:e.clientX, startClientY:e.clientY,
    startX:block.x||0, startY:block.y||0, moved:false,
    canvas, touchedLines,
  };
  e.preventDefault();
});
document.addEventListener("mousemove", (e)=>{
  if(!schemaDrag) return;
  const dx = e.clientX - schemaDrag.startClientX, dy = e.clientY - schemaDrag.startClientY;
  if(Math.abs(dx)>4 || Math.abs(dy)>4) schemaDrag.moved = true;
  if(!schemaDrag.moved) return;
  const nx = Math.max(0, schemaDrag.startX + dx), ny = Math.max(0, schemaDrag.startY + dy);
  schemaDrag.block.x = nx; schemaDrag.block.y = ny;
  const el = document.getElementById("blk-"+schemaDrag.id);
  if(el){ el.style.left = nx+"px"; el.style.top = ny+"px"; }
  const c = blockCenter(schemaDrag.block);
  schemaDrag.touchedLines.forEach(line=>{
    if(line.dataset.from===schemaDrag.id){ line.setAttribute("x1", c.cx); line.setAttribute("y1", c.cy); }
    if(line.dataset.to===schemaDrag.id){ line.setAttribute("x2", c.cx); line.setAttribute("y2", c.cy); }
  });
});
document.addEventListener("mouseup", ()=>{
  if(!schemaDrag) return;
  if(schemaDrag.moved){ dragJustHappened = true; scheduleSaveProjects(); render(); }
  schemaDrag = null;
});

document.addEventListener("dragstart", (e)=>{ const card=e.target.closest(".k-card"); if(card){ e.dataTransfer.setData("text/plain", card.dataset.dragId); e.dataTransfer.effectAllowed="move"; card.classList.add("dragging"); } });
document.addEventListener("dragend", (e)=>{ const card=e.target.closest(".k-card"); if(card) card.classList.remove("dragging"); });
document.addEventListener("dragover", (e)=>{ const col=e.target.closest(".k-col-body"); if(col){ e.preventDefault(); col.classList.add("drag-over"); } });
document.addEventListener("dragleave", (e)=>{ const col=e.target.closest(".k-col-body"); if(col && !col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
document.addEventListener("drop", (e)=>{
  const col = e.target.closest(".k-col-body");
  if(col){
    e.preventDefault(); col.classList.remove("drag-over");
    const id = e.dataTransfer.getData("text/plain");
    const statut = col.dataset.dropStatut;
    const p = state.projects.find(x=>x.id===id);
    if(p && statut && p.statut!==statut){
      const wasTermine = p.statut==="Terminé";
      p.statut = statut;
      scheduleSaveProjects(); render();
      if(statut==="Terminé" && !wasTermine) showToast(`🎉 « ${p.titre||'Projet'} » terminé !`, "success");
    }
  }
});

function renderMainView(){
  if(state.view==="home") return renderHome();
  if(state.view==="actualites") return renderActualites();
  if(state.view==="calendrier") return renderCalendarView();
  if(state.view==="documentation") return renderDocumentation();
  if(state.view==="parametres") return renderSettings();
  if(state.showArchived) return renderArchiveView();
  if(state.projects.length===0) return renderEmptyState();
  return state.view==="board" ? renderBoard() : renderListView();
}
function itemsForDate(dateStr){
  const items = [];
  state.projects.filter(p=>!p.archived).forEach(p=>{
    (p.etapes||[]).forEach(e=>{
      if(e.date===dateStr) items.push({texte:e.titre||"Étape", projetId:p.id, projetTitre:p.titre, done:e.statut==="Fait", type:"etape"});
    });
    if(p.dateFin===dateStr) items.push({texte:"Échéance : "+(p.titre||"Projet"), projetId:p.id, projetTitre:p.titre, done:p.statut==="Terminé", type:"fin"});
  });
  return items;
}

      <div class="ring">${iconBook(28)}</div>

      <p>Guides, inspirations, modèles, notes de référence — tout ce qui ne vit pas dans un seul projet trouve sa place ici, comme un wiki personnel.</p>
      <button class="btn-create" style="margin:0 auto;" data-action="doc-new-page">${iconPlus()} Créer une page</button>
    </div>`;
  }

  return `
  <div class="docs-shell">
    <aside class="docs-sidebar">
      <div class="docs-search"><input class="f" placeholder="🔍 Rechercher une page…" id="doc-search-input" value="${escapeHtml(state.docSearch)}" /></div>
      <button type="button" class="btn btn-primary btn-block docs-new-btn" data-action="doc-new-page">${iconPlus()} Nouvelle page</button>
      ${groups || `<p class="hint" style="padding:0 4px;">${state.docPages.length===0?'Aucune page pour le moment.':'Aucun résultat.'}</p>`}
    </aside>
    <div class="docs-main">${mainHtml}</div>
  </div>`;
}
function renderSettings(){
  const u = state.authUser || {};
  const providerId = (u.providerData && u.providerData[0] && u.providerData[0].providerId) || "password";
  const isGoogle = providerId==="google.com";
  const label = u.displayName || u.email || "—";

  return `
  <div class="settings-wrap">
    <div class="news-hero"><h1>${iconSettingsGear(22)} ${escapeHtml(tr('settings_title'))}</h1></div>

    <div class="settings-card">
      <p class="settings-card-title">🌐 ${escapeHtml(tr('settings_lang'))}</p>
      <div class="mode-toggle">
        <button type="button" class="${state.lang==='fr'?'active':''}" data-action="set-lang" data-value="fr">🇫🇷 Français</button>
        <button type="button" class="${state.lang==='en'?'active':''}" data-action="set-lang" data-value="en">🇬🇧 English</button>
      </div>
    </div>

    <div class="settings-card">
      <p class="settings-card-title">👤 ${escapeHtml(tr('settings_account'))}</p>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        <div class="avatar" style="width:40px;height:40px;font-size:14px;background:linear-gradient(135deg,#5243AA,#8777D9);">${initials(label)}</div>
        <div>
          <p style="margin:0;font-weight:700;font-size:13.5px;">${escapeHtml(label)}</p>
          <p style="margin:2px 0 0;font-size:11.5px;color:var(--text-3);">${escapeHtml(tr('settings_signed_in_via'))} ${isGoogle?'Google':'Email / mot de passe'}</p>
        </div>
      </div>
      <button type="button" class="btn btn-danger" data-action="auth-signout">${iconLogout(13)} ${escapeHtml(tr('settings_signout'))}</button>
    </div>

    ${!isGoogle ? `
    <div class="settings-card">
      <p class="settings-card-title">🔒 ${escapeHtml(tr('settings_password'))}</p>
      <div class="field"><label>${escapeHtml(tr('settings_new_password'))}</label><input class="f" type="password" id="settings-new-pw" placeholder="••••••••" /></div>
      <div class="field"><label>${escapeHtml(tr('settings_confirm_password'))}</label><input class="f" type="password" id="settings-confirm-pw" placeholder="••••••••" /></div>
      ${state.settingsPwError?`<p class="hint" style="color:var(--red);">${escapeHtml(state.settingsPwError)}</p>`:''}
      ${state.settingsPwSuccess?`<p class="hint" style="color:var(--green);">✅ Mot de passe modifié avec succès.</p>`:''}
      <button type="button" class="btn btn-primary" data-action="change-password" ${state.settingsPwBusy?'disabled':''}>${state.settingsPwBusy?'…':escapeHtml(tr('settings_change_password'))}</button>
    </div>` : ''}

    <div class="settings-card">
      <p class="settings-card-title">💾 ${escapeHtml(tr('settings_data'))}</p>
      <p style="font-size:12.5px;color:var(--text-3);margin:0 0 12px;">Vos projets sont sauvegardés automatiquement dans votre compte. Exportez ou importez une sauvegarde depuis l'Accueil.</p>
      <button type="button" class="btn" data-action="goto-backup">${iconDatabase(13)} ${escapeHtml(tr('settings_manage_data'))}</button>
    </div>

    <div class="settings-card">
      <p class="settings-card-title">ℹ️ ${escapeHtml(tr('settings_about'))}</p>
      <p style="font-size:12.5px;color:var(--text-3);margin:0;">Yond — suivi de projets personnels avec assistant IA. Compte lié à Firebase, accessible depuis n'importe quelle machine.</p>
    </div>
  </div>`;
}
function renderCalendarView(){
  const base = state.calDate;
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = base.toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);

  const dayNames = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  const headRow = dayNames.map(n=>`<div class="cal-dow">${n}</div>`).join("");

  const cellsHtml = cells.map(d=>{
    if(d===null) return `<div class="cal-cell cal-empty"></div>`;
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const items = itemsForDate(dateStr);
    const isToday = dateStr===todayStr;
    const chips = items.slice(0,3).map(it=>`
      <button type="button" class="cal-item" data-action="open-project" data-id="${it.projetId}" style="${it.done?'opacity:.5;text-decoration:line-through;':''}background:${it.type==='fin'?'var(--red-bg)':'var(--blue-bg)'};color:${it.type==='fin'?'var(--red)':'var(--blue)'};" title="${escapeHtml(it.projetTitre||'')}">${escapeHtml(it.texte)}</button>`).join("");
    const more = items.length>3 ? `<span class="cal-more">+${items.length-3}</span>` : "";
    return `<div class="cal-cell ${isToday?'cal-today':''}">
      <span class="cal-daynum">${d}</span>
      <div class="cal-items">${chips}${more}</div>
    </div>`;
  }).join("");

  return `
  <div class="cal-wrap">
    <div class="cal-header">
      <h2>📅 ${monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1)}</h2>
      <div class="cal-nav">
        <button type="button" class="btn" data-action="cal-today">Aujourd'hui</button>
        <button type="button" class="icon-btn" data-action="cal-prev-month">${iconChevLeft(16)}</button>
        <button type="button" class="icon-btn" data-action="cal-next-month">${iconChevRight(16)}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${headRow}
      ${cellsHtml}
    </div>
    <p style="margin-top:14px;font-size:11.5px;color:var(--text-3);">
      <span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--blue-bg);display:inline-block;border:1px solid var(--blue);"></span>Étape</span>
      <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--red-bg);display:inline-block;border:1px solid var(--red);"></span>Échéance de projet</span>
    </p>
  </div>`;
}
function renderArchiveView(){
  const items = archivedProjects();
  if(items.length===0){
    return `<div class="empty-hero"><div class="ring">${iconArchive(28)}</div><h1>Aucun projet archivé</h1><p>Les projets que vous archivez depuis leur fiche apparaîtront ici, hors du tableau actif.</p></div>`;
  }
  const rows = items.map(p=>{
    const meta = STATUT_META[p.statut]||STATUT_META["Planifié"];
    const dv = domainVisual(p.domaine);
    return `<tr>
      <td><div class="l-title-cell"><span class="k-domicon" style="background:${dv.bg};color:${dv.c};">${dv.icon()}</span><span class="code">${escapeHtml(p.code||'')}</span><span class="title">${escapeHtml(p.titre||"Sans titre")}</span></div></td>
      <td><span class="lozenge" style="color:${meta.color};background:${meta.bg};">${escapeHtml(trStatut(p.statut))}</span></td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--text-3);">${fmtDate(p.dateFin)}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button type="button" class="btn" data-action="restore-project" data-id="${p.id}">${iconUndo(13)} Restaurer</button>
        <button type="button" class="btn btn-danger" style="margin-left:6px;" data-action="ask-delete-project-id" data-id="${p.id}">${iconTrash()} Supprimer</button>
      </td>
    </tr>`;
  }).join("");
  return `<div class="archive-banner">${iconArchive(14)} Vous consultez les archives — ces projets sont masqués du tableau et de la liste.</div>
    <div id="list-view"><table class="l-table"><thead><tr><th>Projet</th><th>Statut</th><th>Échéance</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderMainOnly(){
  const el = document.getElementById("main-area");
  if(!el) return render();
  const focusInfo = captureFocus();
  el.innerHTML = renderMainView();
  restoreFocus(focusInfo);
  const cnt = document.querySelector(".subbar-count[data-role=count]");
  if(cnt) cnt.textContent = `${filteredProjects().length} projet${filteredProjects().length>1?'s':''}`;
  animateCountUps();
}
function updateDiagramPreviewOnly(p){ const el=document.getElementById("diagram-preview"); if(el) el.innerHTML = renderDiagramSVG(effectiveDiagramNodes(p)); }

/* boot */
(function initToastStack(){
  const stack = document.createElement("div");
  stack.id = "toast-stack";
  document.body.appendChild(stack);
})();
render(); // show "checking session" while Firebase resolves auth state
auth.onAuthStateChanged((user) => {
  state.authChecked = true;
  state.authUser = user;
  state.authBusy = false;
  if(user){
    window.storage = firestoreStorage(user.uid);
    state.loaded = false;
    ensureLangLoaded();
    loadProjects();
  } else {
    resetLocalState();
    render();
  }
});
setTimeout(renderSaveStateOnly, 0);
</script>
